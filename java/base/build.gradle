// The VITRAL library: base/src/main holds only the files listed in
// scripts/vitralSubset.txt, byte-identical to the VITRAL checkout's
// java/base/src/main (scripts/vitralSubset.sh --check). RenderPark's own
// classes are in rpkBase/ and rpkOpenGL1/.
plugins {
    id "java-library"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main"]
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    destinationDirectory = layout.buildDirectory.dir("classes/java/main")
}
