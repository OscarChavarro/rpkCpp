plugins {
    id "application"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation(project(":rpkBase"))
    implementation(project(":rpkOpenGL1"))
    // ImagePersistence finds the PNG writer by reflection
    runtimeOnly(project(":awt"))
}

application {
    mainClass = "vsdk.toolkit.app.Main"
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    destinationDirectory = layout.buildDirectory.dir("classes/java/main")
}

tasks.named("run", JavaExec) {
    // Keep script behavior stable: relative output/* paths resolve under java/
    workingDir = rootProject.projectDir
    dependsOn ":rpkBase:buildNativeRandomLibrary"
    jvmArgs "--add-modules", "jdk.incubator.foreign", "--enable-native-access=ALL-UNNAMED"
}
