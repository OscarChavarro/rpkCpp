plugins {
    id "application"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation(project(":base"))
    implementation(project(":testsuite:ApplicationCases:RenderparkApplication"))
}

application {
    mainClass = "vsdk.toolkit.app.rayCorpusReplay.Main"
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    destinationDirectory = layout.buildDirectory.dir("classes/java/main")
}

tasks.named("run", JavaExec) {
    workingDir = rootProject.projectDir
    dependsOn ":base:buildNativeRandomLibrary"
    jvmArgs "--add-modules", "jdk.incubator.foreign", "--enable-native-access=ALL-UNNAMED"
}
